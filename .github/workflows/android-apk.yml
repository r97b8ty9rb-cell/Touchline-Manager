
name: Build Touchline Manager Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'www/**'
      - 'icons/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install JavaScript dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Copy game into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Touchline-Manager-V25.24-Android-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Touchline-Manager-V25.24-Android-APK
          path: Touchline-Manager-V25.24-Android-debug.apk
          if-no-files-found: error
          retention-days: 30
