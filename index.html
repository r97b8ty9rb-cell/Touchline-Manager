<title>Touchline Manager 1984</title>
<style>
:root{--bg:#101b16;--panel:#182820;--line:#42604b;--green:#9bd66b;--cream:#e5e2c6;--muted:#a8b39e;--red:#e28b72;--gold:#e4ca72;--blue:#8eb8d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font-family:'Courier New',monospace;font-size:14px;line-height:1.45}.wrap{max-width:820px;margin:auto;padding:10px}.mast{border:2px solid var(--green);padding:12px;text-align:center;background:#0b130f}.mast h1{font-size:clamp(23px,6vw,36px);letter-spacing:2px;color:var(--green);margin:0}.mast small{color:var(--muted);letter-spacing:3px}.scorebar{display:flex;justify-content:space-between;gap:5px;flex-wrap:wrap;margin:9px 0;padding:9px;border:1px solid var(--line);background:#142119;color:var(--green);font-weight:bold}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:9px 0}.tabs button,button{font: bold 12px 'Courier New';border:1px solid var(--green);background:#1c3024;color:var(--cream);padding:10px 5px;cursor:pointer}.tabs button.active,button.primary{background:var(--green);color:#102015}button:disabled{opacity:.35}.panel{border:1px solid var(--line);background:var(--panel);padding:12px;margin:9px 0}.panel h2{font-size:16px;color:var(--green);margin:0 0 9px;border-bottom:1px dashed var(--line);padding-bottom:7px}.muted{color:var(--muted)}.big{font-size:22px;color:var(--gold);font-weight:bold}.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dotted #3a5141}.row:last-child{border:0}.btnrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btnrow button{flex:1;min-width:105px}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{text-align:right;padding:6px 3px;border-bottom:1px solid var(--line);white-space:nowrap}.table th:first-child,.table td:first-child{text-align:left;white-space:normal}.table th{color:var(--green)}.table tr.you{color:var(--gold);font-weight:bold}.player{display:grid;grid-template-columns:minmax(0,1fr) 42px 55px;gap:5px;padding:7px 0;border-bottom:1px dotted var(--line);align-items:center}.player button{padding:5px}.player small{color:var(--muted);display:block}.notice{color:var(--gold);padding:8px;border:1px dashed var(--gold);margin-top:8px}.good{color:var(--green)}.bad{color:var(--red)}.hidden{display:none}.footer{text-align:center;color:#728477;font-size:11px;padding:15px}.clubgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.club{padding:12px;text-align:left}.club strong{display:block;color:var(--green)}.club span{font-size:11px;color:var(--muted)}.pill{display:inline-block;border:1px solid var(--line);padding:2px 6px;color:var(--muted);font-size:11px}.commentary{background:#0d1711;border:1px solid var(--line);padding:9px;max-height:270px;overflow:auto}.commentary p{margin:5px 0;padding:7px 6px;border-bottom:1px dotted #314638}.commentary p.goal{color:var(--green);font-weight:bold;background:#14251a}.commentary p.miss{color:var(--gold)}.commentary p.whistle{color:var(--muted);font-style:italic}.soundrow{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.soundrow button{flex:1;min-width:125px}.matchstage{background:#0b1710;border:1px solid var(--line);padding:8px;margin:8px 0}.matchstage canvas{display:block;width:100%;height:auto;aspect-ratio:640/360;background:#183d25;border:1px solid #71915a}.matchcaption{min-height:24px;color:var(--gold);text-align:center;padding:6px 2px;font-weight:bold}.incidentbuttons{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.incidentbuttons button{flex:1;min-width:100px}.pitchhint{font-size:11px;color:var(--muted);text-align:center}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.stat{background:#122019;padding:8px;border:1px solid var(--line)}.stat b{display:block;color:var(--gold);font-size:18px}.selectline{width:100%;padding:9px;background:#102018;color:var(--cream);border:1px solid var(--line);font:13px 'Courier New'}.smallbtn{padding:5px 7px}.marketitem{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px dotted var(--line)}.end{text-align:center;padding:15px;color:var(--gold)}@media(min-width:600px){.twocol{display:grid;grid-template-columns:1fr 1fr;gap:9px}}
</style></head><body><div class="wrap"><header class="mast"><h1>TOUCHLINE MANAGER</h1><small>THE 1984 FOOTBALL CHALLENGE · SECOND EDITION</small></header><div id="app"></div><div class="footer">AN ORIGINAL RETRO FOOTBALL MANAGEMENT GAME · OFFLINE EDITION · V3 ANIMATED MATCH</div></div>
<script>
'use strict';
const CLUBS=[['AFC Albion',68,22000],['Bristol Rovers',65,18000],['Cwm Valley',61,14000],['Dunford Town',60,13000],['Eastborough',58,12000],['Fleet Athletic',57,11000],['Glenchester',55,10000],['Haversham',53,9000]];
const FIRST=['Mason','Price','Davies','Hughes','Morgan','Reed','Bennett','Clarke','Evans','Foster','Parker','Collins','Ward','Powell','Brooks','Turner','James','Ellis','Campbell','Morris','Bailey','Thomas'];
const POS=['GK','DF','DF','DF','DF','DF','MF','MF','MF','MF','MF','FW','FW','FW','GK','DF','MF','FW'];
const TACTICS={Defensive:{attack:-5,defence:7},Balanced:{attack:0,defence:0},Attacking:{attack:8,defence:-6}};
let game=null,tab='club',lastReport=null;let soundEnabled=localStorage.getItem('tm84_sound')!=='off';
const $=id=>document.getElementById(id);const money=n=>'£'+Math.round(n).toLocaleString('en-GB');const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function makePlayer(i,boost=0){let pos=POS[i%POS.length],skill=rnd(43,72)+boost;return{id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),name:FIRST[rnd(0,FIRST.length-1)]+' '+['Jones','Williams','Davies','Roberts','Lewis','Thomas','Morgan','Griffiths','Edwards','Rees'][rnd(0,9)],pos,skill:Math.min(88,skill),fitness:rnd(82,100),age:rnd(18,34),wage:rnd(90,230),value:Math.round(skill*skill*2.1/100)*100,selected:false,goals:0,apps:0,injury:0,form:5};}
function makeSchedule(){let ids=[0,1,2,3,4,5,6,7],first=[];for(let r=0;r<7;r++){let games=[];for(let i=0;i<4;i++){let a=ids[i],b=ids[7-i];if((r+i)%2) [a,b]=[b,a];games.push([a,b]);}first.push(games);ids=[ids[0],ids[7],...ids.slice(1,7)];}return [...first,...first.map(g=>g.map(([a,b])=>[b,a]))];}
function fresh(index){let teams=CLUBS.map((c,i)=>({id:i,name:c[0],strength:c[1],cash:c[2],pts:0,w:0,d:0,l:0,gf:0,ga:0,played:0}));let squad=Array.from({length:18},(_,i)=>makePlayer(i, index===2?0:Math.round((CLUBS[index][1]-61)/3)));squad.forEach((p,i)=>p.selected=i<11);return{clubIndex:index,teams,squad,week:1,season:1,cash:CLUBS[index][2],morale:65,tactic:'Balanced',history:[],schedule:makeSchedule(),market:[],last:null,totalGate:0};}
function save(){try{localStorage.setItem('tm84_v3',JSON.stringify(game));localStorage.setItem('tm84_v2',JSON.stringify(game));}catch(e){}}
function load(){try{let raw=localStorage.getItem('tm84_v3')||localStorage.getItem('tm84_v2');if(raw){game=JSON.parse(raw);if(!game.schedule)game.schedule=makeSchedule();return true}}catch(e){}return false}
function me(){return game.teams[game.clubIndex]}function sortTable(){return [...game.teams].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}function rank(){return sortTable().findIndex(t=>t.id===game.clubIndex)+1}function XI(){return game.squad.filter(p=>p.selected)}function strength(){let x=XI();if(!x.length)return 0;return Math.round(x.reduce((s,p)=>s+p.skill*(p.fitness/100)*(p.injury?0.35:1)*(p.form/5),0)/x.length)}
function fixture(){return game.schedule[game.week-1].find(g=>g.includes(game.clubIndex));}function oppId(){let f=fixture();return f[0]===game.clubIndex?f[1]:f[0]}function isHome(){return fixture()[0]===game.clubIndex}
function start(i){game=fresh(i);tab='club';save();render()}
function render(){let app=$('app');if(!game){app.innerHTML=`<section class="panel"><h2>WELCOME, MANAGER</h2><p>Choose your club. Build a winning side, balance the books and take your team to the top.</p><p class="muted">8 clubs · 14 league matches · transfers · tactics · match reports · local career saves.</p><h2>SELECT YOUR CLUB</h2><div class="clubgrid">${CLUBS.map((c,i)=>`<button class="club" onclick="start(${i})"><strong>${c[0]}</strong><span>Squad rating ${c[1]} · Funds ${money(c[2])}</span></button>`).join('')}</div><div class="notice">The challenge: finish above the other seven clubs after home and away fixtures.</div></section>`;return;}
let c=me();app.innerHTML=`<div class="scorebar"><span>${c.name.toUpperCase()}</span><span>SEASON ${game.season} · WEEK ${Math.min(game.week,14)}/14</span><span>${money(game.cash)}</span></div><nav class="tabs">${[['club','CLUB'],['team','TEAM'],['transfers','TRANSFERS'],['table','TABLE'],['news','NEWS']].map(([id,l])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';render()">${l}</button>`).join('')}</nav><main>${tab==='club'?clubPage():tab==='team'?teamPage():tab==='transfers'?transferPage():tab==='table'?tablePage():newsPage()}</main>`;}
function clubPage(){let played=game.week>14;let o=played?null:game.teams[oppId()];return `<div class="twocol"><section class="panel"><h2>CLUB REPORT</h2><div class="big">${esc(me().name)}</div><div class="row"><span>League position</span><b>${rank()} of 8</b></div><div class="row"><span>Manager's morale</span><b>${game.morale}%</b></div><div class="row"><span>Squad strength</span><b>${strength()}</b></div><div class="row"><span>Transfer funds</span><b>${money(game.cash)}</b></div><div class="row"><span>Weekly wages</span><b>${money(game.squad.reduce((s,p)=>s+p.wage,0))}</b></div><div class="row"><span>Matches played</span><b>${me().played}/14</b></div></section><section class="panel"><h2>${played?'SEASON COMPLETE':'NEXT FIXTURE · WEEK '+game.week}</h2>${played?`<div class="big">${rank()===1?'CHAMPIONS!':'FINAL POSITION: '+rank()}</div><p>The season is complete. Review the final table and start another campaign when ready.</p><button class="primary" onclick="newSeason()">START NEXT SEASON</button>`:`<div class="big" style="text-align:center">${isHome()?esc(me().name)+'<br><span class="muted">v</span><br>'+esc(o.name):esc(o.name)+'<br><span class="muted">v</span><br>'+esc(me().name)}</div><p class="muted" style="text-align:center">${isHome()?'HOME':'AWAY'} · League Division</p><div class="row"><span>Opposition rating</span><b>${o.strength}</b></div><div class="row"><span>Your team rating</span><b>${strength()}</b></div><div class="btnrow"><button class="primary" onclick="playWeek()">KICK OFF</button><button onclick="tab='team';render()">TEAM SHEET</button></div>`}${game.last?`<div class="notice">LAST RESULT: ${esc(game.last)}</div>`:''}</section></div><section class="panel"><h2>MANAGER'S NOTEBOOK</h2><p>Pick your strongest available eleven, keep them fit and choose a tactic to suit the opposition.</p><div class="statgrid"><div class="stat"><span class="muted">League points</span><b>${me().pts}</b></div><div class="stat"><span class="muted">Goal difference</span><b>${me().gf-me().ga}</b></div></div></section>`}
function teamPage(){return `<section class="panel"><h2>FIRST TEAM SQUAD</h2><p class="muted">Choose exactly eleven players. Injured players cannot be selected. Position, ability, fitness and weekly wage are shown.</p><div class="row"><span>Selected</span><b>${XI().length}/11</b></div><div class="row"><span>Current team rating</span><b>${strength()}</b></div><div class="row"><span>Playing style</span><select class="selectline" style="width:auto" onchange="setTactic(this.value)">${Object.keys(TACTICS).map(t=>`<option ${game.tactic===t?'selected':''}>${t}</option>`).join('')}</select></div>${game.squad.map((p,i)=>`<div class="player"><div><b>${esc(p.name)}</b> <small>${p.pos} · Skill ${p.skill} · Fit ${p.fitness}% · Age ${p.age} · ${p.injury?'INJURED '+p.injury+'w': 'Wage '+money(p.wage)+'/w'}</small></div><span class="${p.injury?'bad':p.selected?'good':''}">${p.injury?'OUT':p.selected?'IN':'—'}</span><button onclick="togglePlayer(${i})" ${p.injury?'disabled':''}>${p.selected?'DROP':'SELECT'}</button></div>`).join('')}<div class="btnrow"><button onclick="restSquad()">REST SQUAD</button><button onclick="autoSelect()">PICK BEST XI</button></div></section>`}
function transferPage(){if(!game.market.length)generateMarket();return `<section class="panel"><h2>TRANSFER MARKET</h2><p class="muted">Available players · fees paid from transfer funds · wages added to weekly costs. Squad limit: 22.</p><div class="row"><span>Available funds</span><b>${money(game.cash)}</b></div><div class="row"><span>Squad size</span><b>${game.squad.length}/22</b></div>${game.market.map((p,i)=>`<div class="marketitem"><div><b>${esc(p.name)}</b><small class="muted" style="display:block">${p.pos} · Skill ${p.skill} · Age ${p.age} · Wage ${money(p.wage)}/week</small><span class="muted">Asking fee ${money(p.value)}</span></div><button class="smallbtn" onclick="signPlayer(${i})" ${game.cash<p.value||game.squad.length>=22?'disabled':''}>SIGN</button></div>`).join('')}<div class="btnrow"><button onclick="generateMarket(true)">REFRESH MARKET</button></div></section>`}
function tablePage(){return `<section class="panel"><h2>LEAGUE TABLE</h2><table class="table"><thead><tr><th>CLUB</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>PTS</th></tr></thead><tbody>${sortTable().map((t,i)=>`<tr class="${t.id===game.clubIndex?'you':''}"><td>${i+1}. ${esc(t.name)}</td><td>${t.played}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.pts}</td></tr>`).join('')}</tbody></table><p class="muted">Three points for a win · One for a draw. Top club wins the championship.</p></section>`}
function newsPage(){return `<section class="panel"><h2>CLUB NEWS & MATCH REPORTS</h2>${game.history.length?game.history.slice().reverse().map(h=>`<div class="row"><span>WEEK ${h.week} · ${esc(h.text)}</span><b>${h.score}</b></div>`).join(''):'<p class="muted">No matches played yet. Your first fixture awaits.</p>'}<div class="btnrow"><button onclick="exportSave()">EXPORT CAREER</button><button onclick="document.getElementById('importfile').click()">IMPORT CAREER</button><input id="importfile" type="file" accept="application/json" style="display:none" onchange="importSave(this)"><button onclick="if(confirm('Delete this career and start again?')){localStorage.removeItem('tm84_v2');game=null;render()}">NEW CAREER</button></div></section>`}
function setTactic(t){game.tactic=t;save();render()}function togglePlayer(i){let p=game.squad[i];if(!p.selected&&XI().length>=11){alert('Eleven players are already selected. Drop someone first.');return}p.selected=!p.selected;save();render()}function autoSelect(){game.squad.forEach(p=>p.selected=false);let order=[...game.squad].filter(p=>!p.injury).sort((a,b)=>b.skill*b.fitness-a.skill*a.fitness);let chosen=[];for(let pos of ['GK','DF','DF','DF','DF','MF','MF','MF','MF','FW','FW']){let p=order.find(x=>x.pos===pos&&!chosen.includes(x));if(!p)p=order.find(x=>!chosen.includes(x));if(p)chosen.push(p)}chosen.forEach(p=>p.selected=true);save();render()}
function restSquad(){game.squad.forEach(p=>{p.fitness=Math.min(100,p.fitness+18);if(p.injury>0)p.injury=Math.max(0,p.injury-1)});game.morale=Math.min(100,game.morale+2);save();render()}
function generateMarket(force=false){if(game.market.length&&!force)return;game.market=Array.from({length:7},(_,i)=>{let p=makePlayer(i,rnd(-2,13));p.value=Math.round(p.skill*p.skill*2.4/100)*100;p.wage=rnd(100,320);return p});save();if(force)render()}
function signPlayer(i){let p=game.market[i];if(!p||game.cash<p.value||game.squad.length>=22)return;game.cash-=p.value;p.selected=false;game.squad.push(p);game.market.splice(i,1);game.history.push({week:game.week,text:'SIGNED '+p.name,score:money(p.value)});save();render()}
function applyResult(team,gf,ga){team.gf+=gf;team.ga+=ga;team.played++;if(gf>ga){team.w++;team.pts+=3}else if(gf===ga){team.d++;team.pts++}else team.l++}
function playWeek(){
 if(game.week>14)return;
 if(XI().length!==11){alert('Select exactly eleven players before kick-off.');tab='team';render();return}
 let games=game.schedule[game.week-1],results=[],myLines=[],myClubId=game.clubIndex;
 for(let [a,b] of games){
  let A=game.teams[a],B=game.teams[b],userA=a===myClubId,userB=b===myClubId,homeBonus=2.5;
  let userAdjust=(strength()-61)+(game.morale-65)*.12,tactic=TACTICS[game.tactic];
  let attackA=A.strength+(userA?userAdjust+tactic.attack:0)+homeBonus,defenceA=A.strength+(userA?userAdjust+tactic.defence:0)+homeBonus;
  let attackB=B.strength+(userB?userAdjust+tactic.attack:0),defenceB=B.strength+(userB?userAdjust+tactic.defence:0);
  let ga=Math.max(0,Math.min(5,Math.round(rnd(0,2)+rnd(0,2)*.45+(attackA-defenceB)*.035)));
  let gb=Math.max(0,Math.min(5,Math.round(rnd(0,2)+rnd(0,2)*.45+(attackB-defenceA)*.035)));
  if(Math.random()<.11)ga++;if(Math.random()<.11)gb++;ga=Math.min(6,ga);gb=Math.min(6,gb);
  applyResult(A,ga,gb);applyResult(B,gb,ga);results.push(`${A.name} ${ga}-${gb} ${B.name}`);
  if(userA||userB)myLines.push({home:A.name,away:B.name,gf:ga,ga:gb});
 }
 let mine=myLines[0],won=mine.gf>mine.ga,draw=mine.gf===mine.ga,selected=XI();
 let events=makeCommentary(mine,selected);
 events.filter(e=>e.type==='goal'&&e.scorerId).forEach(e=>{let p=game.squad.find(x=>x.id===e.scorerId);if(p)p.goals++});
 let report=events.map(e=>e.text);
 game.last=`${mine.home} ${mine.gf}-${mine.ga} ${mine.away} · ${won?'WIN':draw?'DRAW':'DEFEAT'}`;
 game.history.push({week:game.week,text:`${mine.home} v ${mine.away}`,score:`${mine.gf}-${mine.ga}`});
 let gate=isHome()?rnd(1800,3200):rnd(500,900);game.cash+=gate;game.totalGate+=gate;
 let wages=game.squad.reduce((s,p)=>s+p.wage,0);game.cash-=wages;
 if(won){game.morale=Math.min(100,game.morale+7);game.cash+=rnd(900,1500)}else if(draw){game.morale=Math.min(100,game.morale+2);game.cash+=500}else game.morale=Math.max(20,game.morale-6);
 selected.forEach(p=>{p.apps++;p.fitness=Math.max(35,p.fitness-rnd(9,15));p.form=won?Math.min(7,p.form+1):draw?p.form:Math.max(2,p.form-1);if(Math.random()<.018){p.injury=rnd(1,2);p.selected=false;report.push(`${p.name} limps off injured (${p.injury} week${p.injury>1?'s':''}).`)}});
 game.squad.filter(p=>!p.selected).forEach(p=>p.fitness=Math.min(100,p.fitness+4));
 game.week++;lastReport={mine,report,events,results,gate,wages,stats:events.stats};save();render();showReport();if(soundEnabled)playMatchSounds(events);
}
function makeCommentary(m,selected){
 let events=[],homeScore=0,awayScore=0,homeShots=0,awayShots=0,homeOn=0,awayOn=0;
 const push=(minute,type,text,extra={})=>events.push({minute,type,text,...extra});
 push(0,'whistle',`KICK-OFF! ${m.home} v ${m.away}. The referee blows his whistle and we're underway.`);
 const homeIsUser=m.home===me().name,awayIsUser=m.away===me().name;
 const candidates=selected.filter(p=>p.pos==='FW'||p.pos==='MF');
 const choose=(arr)=>arr[rnd(0,Math.max(0,arr.length-1))];
 const opponentNames=['M. Carter','J. Wilson','A. Bennett','P. Hughes','D. Morgan','S. Taylor','R. Evans','C. Price'];
 const goalMinutes=[];
 for(let i=0;i<m.gf;i++)goalMinutes.push({minute:rnd(7,88),side:'home'});
 for(let i=0;i<m.ga;i++)goalMinutes.push({minute:rnd(7,88),side:'away'});
 const missCount=rnd(3,5)+rnd(1,2);
 for(let i=0;i<missCount;i++){
  let side=Math.random()<.5?'home':'away';
  let minute=rnd(5,87),kind=Math.random()<.55?'wide':'saved';
  let team=side==='home'?m.home:m.away;
  let player=(side==='home'&&homeIsUser)||(side==='away'&&awayIsUser)?choose(candidates)?.name:choose(opponentNames);
  let text=kind==='wide'?`${player||'The forward'} shoots — JUST WIDE! The chance goes begging for ${team}.`:`${player||'The striker'} lets fly — a fine save by the goalkeeper denies ${team}.`;
  if(side==='home'){homeShots++;if(kind==='saved')homeOn++}else{awayShots++;if(kind==='saved')awayOn++}
  push(minute,'miss',text,{side,shot:kind});
 }
 for(let g of goalMinutes){
  let side=g.side,team=side==='home'?m.home:m.away;
  let isUser=(side==='home'&&homeIsUser)||(side==='away'&&awayIsUser);
  let player=isUser?choose(candidates):choose(opponentNames);
  if(side==='home'){homeScore++;homeShots++;homeOn++}else{awayScore++;awayShots++;awayOn++}
  let score=`${homeScore}-${awayScore}`;
  push(g.minute,'goal',`GOAL! ${player?.name||player||'The striker'} scores for ${team}! ${score}.`,{side,scorer:player?.name||player||'Unknown',scorerId:player?.id||null,score});
 }
 const neutral=[
  'A clever pass splits the defence, but the final ball is just too strong.',
  'A strong tackle wins possession in midfield.',
  'The winger sends a dangerous cross into the penalty area.',
  'A free kick is floated towards the far post and headed clear.',
  'The crowd appeals for a penalty, but the referee waves play on.',
  'A long-range effort rises over the crossbar.'
 ];
 for(let i=0;i<4;i++)push(rnd(8,84),'play',neutral[rnd(0,neutral.length-1)]);
 if(Math.random()<.16)push(rnd(20,82),'booking','BOOKING! The referee produces a yellow card for a late challenge.');
 push(45,'whistle','HALF TIME. The players head for the dressing rooms.');
 push(90,'whistle',`FULL TIME! ${m.home} ${m.gf}-${m.ga} ${m.away}.`);
 events.sort((a,b)=>a.minute-b.minute);
 let scoreH=0,scoreA=0;
 events.forEach(e=>{if(e.type==='goal'){if(e.side==='home')scoreH++;else scoreA++;e.scoreAtEvent=`${scoreH}-${scoreA}`}});
 events.stats={homeShots,awayShots,homeOn,awayOn,homeMisses:events.filter(e=>e.type==='miss'&&e.side==='home').length,awayMisses:events.filter(e=>e.type==='miss'&&e.side==='away').length};
 return events;
}
function toggleSound(){soundEnabled=!soundEnabled;localStorage.setItem('tm84_sound',soundEnabled?'on':'off');if(soundEnabled&&lastReport?.events)playMatchSounds(lastReport.events);showReport()}
function tone(ctx,frequency,start,duration,wave='square',volume=.045,endFrequency=null){let o=ctx.createOscillator(),g=ctx.createGain();o.type=wave;o.frequency.setValueAtTime(frequency,start);if(endFrequency)o.frequency.exponentialRampToValueAtTime(endFrequency,start+duration);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(volume,start+.012);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(g);g.connect(ctx.destination);o.start(start);o.stop(start+duration+.02)}
function soundWhistle(ctx,t){tone(ctx,1500,t,.22,'square',.025,2100);tone(ctx,1700,t+.16,.28,'square',.022,1200)}
function soundGoal(ctx,t){[523,659,784,1047].forEach((f,i)=>tone(ctx,f,t+i*.105,.16,'square',.055));tone(ctx,784,t+.48,.32,'triangle',.035)}
function soundMiss(ctx,t){tone(ctx,220,t,.16,'sawtooth',.04,145);tone(ctx,165,t+.18,.22,'sawtooth',.035,110)}
function playMatchSounds(events){try{let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;let ctx=new AC();ctx.resume().then(()=>{let base=ctx.currentTime+.08,span=8;events.forEach(e=>{let t=base+(e.minute/90)*span;if(e.type==='whistle')soundWhistle(ctx,t);else if(e.type==='goal')soundGoal(ctx,t);else if(e.type==='miss')soundMiss(ctx,t)});setTimeout(()=>ctx.close().catch(()=>{}),10500)}).catch(()=>{})}catch(e){}}
function showReport(){
 if(!lastReport)return;
 let r=lastReport,stats=r.stats||{},incidents=r.events.filter(e=>e.type==='goal'||e.type==='miss');
 let eventRows=r.events.map(e=>{let cls=e.type==='goal'?'goal':e.type==='miss'?'miss':e.type==='whistle'?'whistle':'';let label=e.type==='goal'?'⚽':e.type==='miss'?'✕':e.type==='whistle'?'♪':e.type==='booking'?'!':'·';return `<p class="${cls}"><b>${String(e.minute).padStart(2,'0')}' ${label}</b> &nbsp;${esc(e.text)}</p>`}).join('');
 let incidentButtons=incidents.length?incidents.map((e,i)=>`<button onclick="animateIncident(${i})">${String(e.minute).padStart(2,'0')}' ${e.type==='goal'?'GOAL':'CHANCE'}</button>`).join(''):'<p class="muted">No clear chances in this match.</p>';
 let html=`<section class="panel"><h2>FULL-TIME REPORT</h2><div class="big" style="text-align:center">${esc(r.mine.home)} ${r.mine.gf} - ${r.mine.ga} ${esc(r.mine.away)}</div><div class="row"><span>Gate receipts</span><b>${money(r.gate)}</b></div><div class="row"><span>Weekly wages</span><b class="bad">-${money(r.wages)}</b></div><h2 style="margin-top:12px">MATCH HIGHLIGHTS — WATCH THE ACTION</h2><div class="matchstage"><canvas id="matchCanvas" width="640" height="360" aria-label="Animated retro football match highlight"></canvas><div id="matchCaption" class="matchcaption">READY FOR THE HIGHLIGHTS</div><div class="btnrow"><button class="primary" onclick="watchHighlights()">▶ WATCH GOALS & CHANCES</button><button onclick="resetPitch()">RESET PITCH</button></div><div class="incidentbuttons">${incidentButtons}</div><div class="pitchhint">Select an incident to replay it. Home attacks to the right; away attacks to the left.</div></div><h2 style="margin-top:12px">MATCH STATISTICS</h2><div class="row"><span>Shots</span><b>${stats.homeShots||0} - ${stats.awayShots||0}</b></div><div class="row"><span>Shots on target</span><b>${stats.homeOn||0} - ${stats.awayOn||0}</b></div><div class="row"><span>Missed chances</span><b>${stats.homeMisses||0} - ${stats.awayMisses||0}</b></div><div class="soundrow"><button onclick="toggleSound()">SOUND: ${soundEnabled?'ON':'OFF'}</button><button onclick="playMatchSounds(lastReport.events)" ${soundEnabled?'':'disabled'}>REPLAY 8-BIT SOUNDS</button></div><h2 style="margin-top:12px">MATCH COMMENTARY</h2><div class="commentary">${eventRows}</div><h2 style="margin-top:12px">OTHER RESULTS</h2>${r.results.map(x=>`<div class="row">${esc(x)}</div>`).join('')}<div class="btnrow"><button class="primary" onclick="lastReport=null;tab='club';render()">CONTINUE</button></div></section>`;
 let old=$('report');if(old)old.remove();let d=document.createElement('div');d.id='report';d.innerHTML=html;$('app').appendChild(d);drawPitchFrame(0,null);d.scrollIntoView({behavior:'smooth'});
}
let incidentTimer=null,animationToken=0;
function resetPitch(){animationToken++;if(incidentTimer)clearTimeout(incidentTimer);drawPitchFrame(0,null);let c=$('matchCaption');if(c)c.textContent='READY FOR THE HIGHLIGHTS'}
function drawPitchFrame(progress,event){
 let canvas=$('matchCanvas');if(!canvas)return;let ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;
 ctx.clearRect(0,0,w,h);
 // Deep, slightly raised stadium backdrop and a single attacking half-pitch.
 let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#101b15');sky.addColorStop(1,'#07100b');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
 // Stand lights / distant crowd give the scene a tiny 1980s arcade atmosphere.
 for(let i=0;i<90;i++){let x=(i*73)%w,y=7+(i*19)%30;ctx.fillStyle=i%3===0?'#d4c77a':i%3===1?'#54745b':'#263b2c';ctx.fillRect(x,y,3,3)}
 const cx=w/2,top=48,bottom=337,far=205,near=570;
 function project(u,v){let half=far+(near-far)*v;return {x:cx+(u-.5)*half,y:top+(bottom-top)*v}}
 function poly(points,fill,stroke=null,lw=1){ctx.beginPath();points.forEach((p,i)=>{let q=project(p[0],p[1]);if(!i)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)});ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
 // Pitch surface, alternating perspective-mown strips.
 poly([[0,0],[1,0],[1,1],[0,1]],'#285b35','#9fbd83',2);
 for(let i=0;i<8;i++){let v0=i/8,v1=(i+1)/8;poly([[0,v0],[1,v0],[1,v1],[0,v1]],i%2?'rgba(8,35,17,.12)':'rgba(157,194,112,.10)')}
 // Side lines and halfway edge of the visible half.
 let a=project(0,0),b=project(1,0),c=project(1,1),d=project(0,1);
 ctx.strokeStyle='#d2dfb5';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(d.x,d.y);ctx.lineTo(c.x,c.y);ctx.lineTo(b.x,b.y);ctx.stroke();
 let boxTop=.20,boxBottom=.56;
 function line(u1,v1,u2,v2,width=2){let p1=project(u1,v1),p2=project(u2,v2);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.lineWidth=width;ctx.stroke()}
 ctx.strokeStyle='#d2dfb5';
 line(.18,boxTop,.82,boxTop);line(.18,boxTop,.18,boxBottom);line(.82,boxTop,.82,boxBottom);
 line(.34,.10,.66,.10);line(.34,.10,.34,.23);line(.66,.10,.66,.23);
 let spot=project(.5,.31);ctx.fillStyle='#e6e4c9';ctx.beginPath();ctx.arc(spot.x,spot.y,3,0,Math.PI*2);ctx.fill();
 // Penalty arc in perspective.
 ctx.beginPath();for(let i=0;i<=24;i++){let ang=Math.PI*(1+i/24);let u=.5+Math.cos(ang)*.19,v=.39+Math.sin(ang)*.12;let q=project(u,v);if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)}ctx.stroke();
 // Single goal at the far end, with a shaded net and chunky posts.
 let gl=project(.37,0),gr=project(.63,0),gy=top-7;
 ctx.fillStyle='#cbd7b7';ctx.fillRect(gl.x,gy,gr.x-gl.x,8);
 ctx.strokeStyle='#f1edcf';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(gl.x,gy+8);ctx.lineTo(gl.x,top+13);ctx.lineTo(gr.x,top+13);ctx.lineTo(gr.x,gy+8);ctx.stroke();
 ctx.strokeStyle='rgba(220,232,194,.55)';ctx.lineWidth=1;for(let i=1;i<8;i++){let x=gl.x+(gr.x-gl.x)*i/8;ctx.beginPath();ctx.moveTo(x,gy+8);ctx.lineTo(x,top+12);ctx.stroke()}for(let i=1;i<4;i++){let y=gy+8+i*6;ctx.beginPath();ctx.moveTo(gl.x,y);ctx.lineTo(gr.x,y);ctx.stroke()}
 // Attacking team approaches the one visible goal. Away highlights are mirrored into this camera view.
 const own=[[.50,.91],[.23,.72],[.40,.78],[.60,.78],[.77,.72],[.18,.53],[.39,.58],[.61,.58],[.82,.53],[.39,.36],[.61,.36]];
 const opp=[[.50,.17],[.22,.31],[.39,.29],[.61,.29],[.78,.31],[.15,.48],[.34,.46],[.66,.46],[.85,.48],[.39,.63],[.61,.63]];
 let side=event?.side||'home';
 function player(u,v,n,colour,keeper=false){let q=project(u,v),scale=.56+v*.72;
  // ground shadow
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(q.x+2,q.y+7*scale,9*scale,4*scale,0,0,Math.PI*2);ctx.fill();
  // body, head and highlight create a little pseudo-3D sprite
  ctx.fillStyle=colour;ctx.beginPath();ctx.ellipse(q.x,q.y,7.5*scale,9*scale,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#101b12';ctx.lineWidth=1.4;ctx.stroke();
  ctx.fillStyle=keeper?'#f2cf73':'#e6d9b9';ctx.beginPath();ctx.arc(q.x,q.y-7*scale,3.2*scale,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.32)';ctx.fillRect(q.x-4*scale,q.y-5*scale,2*scale,7*scale);
  ctx.fillStyle='#102016';ctx.font=`bold ${Math.max(7,8*scale)}px Courier New`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(n),q.x,q.y+1*scale);
 }
 // Small positional shifts make the forward line surge as the move develops.
 own.forEach((p,i)=>{let surge=progress>0?Math.min(progress,.78)*(i>=8?.09:.025):0;let v=Math.max(.08,p[1]-surge);let u=p[0]+(i===9||i===10?(side==='home'?.025:-.025)*Math.min(progress,1):0);player(u,v,i+1,'#a6d66d')});
 opp.forEach((p,i)=>{let press=progress>.35&&i>4?Math.min((progress-.35)*.10,.045):0;player(p[0],Math.min(.78,p[1]+press),i+1,'#ded9bd')});
 // Goalkeeper moves across the mouth of the goal to make a save or react to a goal.
 let dive=progress>.70?Math.min(1,(progress-.70)/.25):0;let keeperU=.5+(event?.type==='miss'&&event?.shot==='saved' ? 0.20 : -0.12)*dive;player(keeperU,.105,1,'#e7b95e',true);
 // Ball moves through a three-pass move towards the far goal. Perspective projection adds depth.
 let pts=[[.50,.88],[.37,.65],[.61,.48],[.50,.12]];
 let seg=progress<.22?0:progress<.48?1:2;
 let local=progress<.22?progress/.22:progress<.48?(progress-.22)/.26:(progress-.48)/.52;
 let aa=pts[seg],bb=pts[seg+1],u=aa[0]+(bb[0]-aa[0])*Math.max(0,Math.min(1,local)),v=aa[1]+(bb[1]-aa[1])*Math.max(0,Math.min(1,local));
 if(progress>=.72){u=.5+(event?.type==='miss'&&event?.shot==='wide' ? 0.24 : 0);v=.02+(v-.02)*(1-Math.min(1,(progress-.72)/.28));if(event?.type==='miss'&&event?.shot==='saved')u=.5+.10*dive}
 let ball=project(u,v),lift=progress>.68?Math.sin(Math.min(1,(progress-.68)/.32)*Math.PI)*13:0;
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(ball.x,ball.y+5,5,2,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y-lift,5.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#172016';ctx.lineWidth=1;ctx.stroke();ctx.beginPath();ctx.moveTo(ball.x-2,ball.y-lift-2);ctx.lineTo(ball.x+2,ball.y-lift+2);ctx.moveTo(ball.x+2,ball.y-lift-2);ctx.lineTo(ball.x-2,ball.y-lift+2);ctx.stroke();
 if(progress>.76&&event?.type==='goal'){ctx.strokeStyle='#d8ef9a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,top+6,12+(progress-.76)*90,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#d8ef9a';ctx.font='bold 17px Courier New';ctx.textAlign='center';ctx.fillText('GOAL!',cx,top+45)}
 if(progress>.76&&event?.type==='miss'&&event?.shot==='saved'){ctx.fillStyle='#f2d37b';ctx.font='bold 14px Courier New';ctx.textAlign='center';ctx.fillText('SAVE!',cx,top+45)}
 if(progress>.76&&event?.type==='miss'&&event?.shot==='wide'){ctx.fillStyle='#f2d37b';ctx.font='bold 13px Courier New';ctx.textAlign='center';ctx.fillText('JUST WIDE!',cx,top+45)}
}
function drawPlayer(ctx,x,y,n,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#132016';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#102016';ctx.font='bold 9px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(n),x,y+.5)}
function animateIncident(index){let incidents=lastReport?.events.filter(e=>e.type==='goal'||e.type==='miss')||[];let e=incidents[index];if(!e)return;let token=++animationToken;if(incidentTimer)clearTimeout(incidentTimer);let caption=$('matchCaption');if(caption)caption.textContent=`${String(e.minute).padStart(2,'0')}' — ${e.type==='goal'?'GOAL!':e.shot==='saved'?'SHOT — SAVED!':'SHOT — JUST WIDE!'}`;let start=performance.now(),duration=2300;function frame(now){if(token!==animationToken)return;let p=Math.min(1,(now-start)/duration);drawPitchFrame(p,e);if(p<1)requestAnimationFrame(frame);else{let c=$('matchCaption');if(c)c.textContent=e.type==='goal'?`GOAL! ${e.scorer||'THE STRIKER'} — ${e.scoreAtEvent||''}`:e.shot==='saved'?'THE GOALKEEPER MAKES THE SAVE!':'JUST WIDE! — CHANCE MISSED';}}requestAnimationFrame(frame)}
async function watchHighlights(){let incidents=lastReport?.events.filter(e=>e.type==='goal'||e.type==='miss')||[];if(!incidents.length){let c=$('matchCaption');if(c)c.textContent='NO CLEAR CHANCES TO REPLAY';return}let token=++animationToken;for(let i=0;i<incidents.length;i++){if(token!==animationToken)return;await new Promise(resolve=>{let e=incidents[i],start=performance.now(),duration=2100;let c=$('matchCaption');if(c)c.textContent=`${String(e.minute).padStart(2,'0')}' — ${e.type==='goal'?'GOAL!':'CHANCE'}`;function frame(now){if(token!==animationToken){resolve();return}let p=Math.min(1,(now-start)/duration);drawPitchFrame(p,e);if(p<1)requestAnimationFrame(frame);else{if(c)c.textContent=e.type==='goal'?`GOAL! ${e.scorer||'THE STRIKER'} — ${e.scoreAtEvent||''}`:e.shot==='saved'?'SAVED!':'JUST WIDE!';resolve()}}requestAnimationFrame(frame)});await new Promise(resolve=>incidentTimer=setTimeout(resolve,550));}if(token===animationToken){let c=$('matchCaption');if(c)c.textContent='END OF HIGHLIGHTS — REPLAY ANY INCIDENT'} }
function newSeason(){if(game.week<=14)return;if(!confirm('Start a new season? Your club, squad and transfer balance carry forward; league records reset.'))return;game.season++;game.week=1;game.teams.forEach(t=>{t.pts=t.w=t.d=t.l=t.gf=t.ga=t.played=0});game.squad.forEach(p=>{p.fitness=100;p.injury=0;p.selected=false;p.age++;p.form=5});autoSelect();game.morale=60;game.history.push({week:0,text:`SEASON ${game.season} BEGINS`,score:'NEW CAMPAIGN'});game.last=null;save();render()}
function exportSave(){let blob=new Blob([JSON.stringify(game,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='touchline-manager-career.json';a.click();URL.revokeObjectURL(url)}function importSave(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.teams||!x.squad)throw Error();game=x;save();render();alert('Career imported successfully.')}catch(e){alert('That file is not a valid Touchline Manager career.')}};r.readAsText(f)}
if(!load())game=null;render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
