function roundRobin(ids){
 let arr=[...ids];if(arr.length%2)arr.push(null);let n=arr.length,rounds=[];
 for(let r=0;r<n-1;r++){let games=[];for(let i=0;i<n/2;i++){let a=arr[i],b=arr[n-1-i];if(a!==null&&b!==null){if((r+i)%2)[a,b]=[b,a];games.push([a,b]);}}rounds.push(games);arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];}
 return [...rounds,...rounds.map(g=>g.map(([a,b])=>[b,a]))];
}
function buildPyramid(customName='Cwm Valley'){

 DIVISION_ORDER.forEach((d,di)=>{
  let names=[...PYRAMID_NAMES[d]];

 });

}

function simOtherDivisionRound(teams,fixtures){
 for(const [a,b] of fixtures){
  const A=teams[a],B=teams[b],home=A.strength+2.5,away=B.strength;
  let ga=Math.max(0,Math.min(6,Math.round(rnd(0,2)+rnd(0,2)*.45+(home-B.strength)*.035)));
  let gb=Math.max(0,Math.min(6,Math.round(rnd(0,2)+rnd(0,2)*.45+(away-A.strength)*.035)));
  applyResult(A,ga,gb);applyResult(B,gb,ga);
 }
}

function promotionRelegation(){

 const up=tableSort(div['League Two']).slice(0,3);

 const up1=tableSort(div['League One']).slice(0,3);

 const up2=tableSort(div['Championship']).slice(0,3);
 const down2=tableSort(div['Premier League']).slice(-3);
 function move(from,to,teams){const ids=new Set(teams.map(t=>t.id));div[from]=div[from].filter(t=>!ids.has(t.id));teams.forEach(t=>{t.division=to;resetTeamRecord(t);div[to].push(t);});}
 move('League Two','League One',up);move('League One','League Two',down);
 move('League One','Championship',up1);move('Championship','League One',down1);
 move('Championship','Premier League',up2);move('Premier League','Championship',down2);
 // Preserve 25 clubs in League Two by adding the three relegated and moving three promoted.
 DIVISION_ORDER.forEach(d=>{div[d].forEach(resetTeamRecord);game.pyramid.schedules[d]=roundRobin(div[d].map((_,i)=>i));});
 game.pyramid.week=1;game.pyramid.season++;
}

function makeCommentary(m,selected){

 push(0,'whistle',`KICK-OFF! ${m.home} v ${m.away}. The referee blows his whistle and we're underway.`);
 const homeIsUser=m.home===me().name,awayIsUser=m.away===me().name;
 const candidates=selected.filter(p=>p.pos==='FW'||p.pos==='MF');
 const choose=(arr)=>arr.length?arr[rnd(0,arr.length-1)]:null;
 const opponentNames=['M. Carter','J. Wilson','A. Bennett','P. Hughes','D. Morgan','S. Taylor','R. Evans','C. Price'];
 for(let i=0;i<m.gf;i++){
  let player=homeIsUser?choose(candidates):choose(opponentNames);
  push(rnd(7,88),'goal','',{side:'home',scorer:player?.name||player||'The striker',scorerId:player?.id||null});
  homeShots++;homeOn++;
 }
 for(let i=0;i<m.ga;i++){
  let player=awayIsUser?choose(candidates):choose(opponentNames);
  push(rnd(7,88),'goal','',{side:'away',scorer:player?.name||player||'The striker',scorerId:player?.id||null});
  awayShots++;awayOn++;
 }
 const missCount=rnd(4,7);
 for(let i=0;i<missCount;i++){
  let side=Math.random()<.5?'home':'away',kind=Math.random()<.55?'wide':'saved',team=side==='home'?m.home:m.away;
  let isUser=(side==='home'&&homeIsUser)||(side==='away'&&awayIsUser);
  let player=isUser?choose(candidates):choose(opponentNames);
  let text=kind==='wide'?`${player?.name||player||'The forward'} shoots — JUST WIDE! The chance goes begging for ${team}.`:`${player?.name||player||'The striker'} lets fly — a fine save by the goalkeeper denies ${team}.`;
  if(side==='home'){homeShots++;if(kind==='saved')homeOn++}else{awayShots++;if(kind==='saved')awayOn++}
  push(rnd(5,87),'miss',text,{side,shot:kind});
 }
 const neutral=[
  'A clever pass splits the defence, but the final ball is just too strong.',
  'A strong tackle wins possession in midfield.',
  'The winger sends a dangerous cross into the penalty area.',
  'A free kick is floated towards the far post and headed clear.',
  'The crowd appeals for a penalty, but the referee waves play on.',
  'A long-range effort rises over the crossbar.'
 ];
 for(let i=0;i<5;i++)push(rnd(8,84),'play',neutral[rnd(0,neutral.length-1)]);
 if(Math.random()<.16)push(rnd(20,82),'booking','BOOKING! The referee produces a yellow card for a late challenge.');
 push(45,'whistle','HALF TIME. The players head for the dressing rooms.');
 push(90,'whistle',`FULL TIME! ${m.home} ${m.gf}-${m.ga} ${m.away}.`);
 // Sort first, then calculate the running score so commentary can never show a later score before an earlier one.
 events.sort((a,b)=>a.minute-b.minute || (a.type==='goal'?1:0)-(b.type==='goal'?1:0));
 let scoreH=0,scoreA=0;
 events.forEach(e=>{if(e.type==='goal'){
  if(e.side==='home')scoreH++;else scoreA++;
  e.scoreAtEvent=`${scoreH}-${scoreA}`;
  e.text=`GOAL! ${e.scorer} scores for ${e.side==='home'?m.home:m.away}! ${e.scoreAtEvent}.`;
 }});
 events.stats={homeShots,awayShots,homeOn,awayOn,homeMisses:events.filter(e=>e.type==='miss'&&e.side==='home').length,awayMisses:events.filter(e=>e.type==='miss'&&e.side==='away').length};
 return events;
}

pitchMaster.onload=()=>{if($('matchCanvas'))drawPitchFrame(0,null,'idle')};
function drawPitchFrame(progress,event,phase='attack'){
 const canvas=$('matchCanvas');if(!canvas)return;
 const ctx=canvas.getContext('2d');if(!ctx)return;const w=canvas.width,h=canvas.height;
 ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,w,h);
 const scene=event?(event._scene||makeBallPath(event)):null;
 const direction=scene?{secondHalf:scene.secondHalf,attacksRight:scene.attacksRight}:getAttackDirection(event?.side||'home',event?.minute||0);
 const secondHalf=direction.secondHalf;
 // The background, players, keeper, ball and shot destination all use this
 // same direction. This prevents goals and misses travelling to the wrong end.
 const attacksRight=direction.attacksRight;
 const X=x=>attacksRight?x:w-x;
 const Y=y=>65+(y-86)*(217/294);
 // Clean stadium-and-pitch artwork only: no footballers or ball are baked in.
 // Every player and the ball are drawn as live sprites below. The background
 // remains fixed for each half and is horizontally mirrored after half-time.
 if(pitchMaster.complete && pitchMaster.naturalWidth){
  ctx.save();
  if(attacksRight){ctx.translate(w,0);ctx.scale(-1,1)}
  ctx.drawImage(pitchMaster,0,0,w,285);
  ctx.restore();
  // Mirror the pitch and goal, never the advertising lettering.
  ctx.fillStyle='#f4e52d';ctx.fillRect(0,38,w,24);
  ctx.fillStyle='#7b183c';ctx.font='bold 18px monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('TOUCHLINE MANAGER',w/2,50);
 }else{ctx.fillStyle='#319c39';ctx.fillRect(0,0,w,285)}
 // Score strip.
 const shownGoals=lastReport?.events?.filter(e=>e.type==='goal'&&e._shown)||[];
 const sh=shownGoals.filter(e=>e.side==='home').length,sa=shownGoals.filter(e=>e.side==='away').length;
 const minuteText=$('liveMinute')?.textContent||'KICK-OFF';ctx.fillStyle='#080a09';ctx.fillRect(0,285,640,33);ctx.fillStyle='#f1e85b';ctx.font='bold 16px monospace';ctx.textBaseline='middle';ctx.textAlign='left';
 const homeName=(lastReport?.mine?.home||'HOME').toUpperCase(),awayName=(lastReport?.mine?.away||'AWAY').toUpperCase();ctx.fillText(`${homeName}  ${sh}-${sa}  ${awayName}`,10,303);ctx.textAlign='right';ctx.fillText(minuteText.replace(' MINUTES','').replace(' · FULL TIME',' FT'),630,303);
 const m=lastReport?.mine||{};const homeKit=kitForClub(m.home,false);let awayKit=kitForClub(m.away,true);if(colourDistance(homeKit[0],awayKit[0])<115){const alt=TEAM_KITS[m.away]||[];awayKit=alt.length?[alt[2]==='#FFFFFF'?['#202020','#FFFFFF']:['#FFFFFF','#202020']][0]:['#FFFFFF','#202020'];}
 const t=Math.max(0,Math.min(1,progress)),now=scene?t*scene.total:0;
 const screenDir=direction.screenDirection|| (attacksRight?1:-1);
 function sprite(x,footY,kit,num,face,frame,keeper=false){
  x=Math.round(x);footY=Math.round(footY);let phase=Math.floor(frame)%4;let swing=[-2,1,2,-1][phase];
  ctx.fillStyle='rgba(20,55,20,.35)';ctx.fillRect(x-6,footY+1,13,3);
  ctx.fillStyle='#171915';ctx.fillRect(x-3+swing,footY-8,3,7);ctx.fillRect(x+1-swing,footY-8,3,7);
  ctx.fillStyle='#eee8cf';ctx.fillRect(x-4+swing,footY-2,5,2);ctx.fillRect(x+1-swing,footY-2,5,2);
  ctx.fillStyle=kit[1];ctx.fillRect(x-4,footY-13,8,4);
  ctx.fillStyle=keeper?'#e5c34c':kit[0];ctx.fillRect(x-4,footY-24,8,11);
  ctx.fillStyle=kit[0];ctx.fillRect(x+(face>0?4:-6),footY-22,2,7);ctx.fillRect(x+(face>0?-5:4),footY-21,2,6);
  ctx.fillStyle='#d7ad80';ctx.fillRect(x+(face>0?1:-5),footY-31,6,6);ctx.fillStyle='#24221e';ctx.fillRect(x+(face>0?4:-5),footY-29,1,1);
  ctx.fillStyle='#fff8df';ctx.font='bold 6px monospace';ctx.textAlign='center';ctx.fillText(String(num),x,footY-16);
 }
 const attackBase=scene?.attackBase||[{x:112,y:292},{x:170,y:215},{x:218,y:326},{x:265,y:178},{x:312,y:278},{x:365,y:210},{x:408,y:310}];
 const defendBase=scene?.defendBase||[{x:350,y:165},{x:405,y:225},{x:430,y:315},{x:465,y:180},{x:485,y:270},{x:520,y:325},{x:535,y:235}];
 let ballX=X(attackBase[0].x),ballY=attackBase[0].y-3,active=scene?scene.steps.find(st=>now>=st.t0&&now<=st.holdEnd):null;
 let nodePos=[];
 if(scene){
  scene.nodes.forEach((node,i)=>{
   const incoming=scene.steps.find(st=>st.to===i);
   let bx=attackBase[node.player],u=0;
   if(incoming)u=Math.max(0,Math.min(1,(now-incoming.t0)/Math.max(.01,incoming.t1-incoming.t0)));
   else u=0;
   // Receiver moves a short, physically plausible distance while the ball travels.
   const ease=u*u*(3-2*u);nodePos[node.player]={x:bx.x+(node.x-bx.x)*ease,y:bx.y+(node.y-bx.y)*ease};
  });
  if(active){
   const a=scene.nodes[active.from],b=active.to===null?active.target:scene.nodes[active.to];
   const u=Math.max(0,Math.min(1,(now-active.t0)/Math.max(.01,active.t1-active.t0))),e=u*u*(3-2*u);
   ballX=X(a.x+(b.x-a.x)*e);ballY=a.y+(b.y-a.y)*e-3;
  }else if(now>=scene.total){let n=scene.nodes[scene.nodes.length-1];ballX=X(n.x);ballY=n.y-3}
 }
 // Attackers all make small, continuous support runs. Receivers move only a
 // few pixels to meet the pass; nobody can teleport from the goal to midfield.
 attackBase.forEach((p,i)=>{
  let pos=nodePos[i],phase=now*1.45+i*1.8;
  let x=pos?pos.x:p.x+Math.sin(phase)*3.5;
  let y=pos?pos.y:p.y+Math.cos(phase*.8)*3;
  if(scene&&pos&&now>0){let outgoing=scene.steps.find(st=>st.from===i&&now>st.t1);if(outgoing){x+=Math.min(7,(now-outgoing.t1)*2);}}
  sprite(X(x),Y(y),scene?(scene.side==='home'?homeKit:awayKit):homeKit,i+1,screenDir,now*2.3+i);
 });
 // Defenders shuffle as a compact line and track the ball gradually, capped
 // to a short run over the duration of the incident.
 defendBase.forEach((p,i)=>{
  let worldBall=attacksRight?ballX:640-ballX;
  let desiredX=Math.max(p.x-22,Math.min(p.x+22,worldBall-35));
  let u=scene?Math.min(1,now/3.8):0;
  let x=p.x+(desiredX-p.x)*u*.55+Math.sin(now*1.1+i)*2.5;
  let y=p.y+(ballY-p.y)*.035*u+Math.cos(now*.9+i)*2.2;
  sprite(X(x),Y(y),scene?(scene.side==='home'?awayKit:homeKit):awayKit,i+1,-screenDir,now*1.9+i);
 });
 const keeperWorldX=(event?.type==='miss'&&event.shot==='saved')?552:590;const keeperX=X(keeperWorldX),keeperY=245+(scene?Math.max(-9,Math.min(9,(ballY-245)*.12)):0);
 sprite(keeperX,Y(keeperY),['#e5c34c','#202020'],1,-screenDir,now*2.1,true);
 // Square ball settles at the receiving player's boots before the next kick.
 ctx.fillStyle='#fffef0';ctx.fillRect(Math.round(ballX-3),Math.round(Y(ballY)-3),6,6);ctx.strokeStyle='#242820';ctx.lineWidth=1;ctx.strokeRect(Math.round(ballX-3),Math.round(Y(ballY)-3),6,6);
 if(t>.92&&event?.type==='goal'){ctx.fillStyle='#f7ed76';ctx.font='bold 25px monospace';ctx.textAlign='center';ctx.fillText('GOAL!',320,104)}
 if(t>.92&&event?.type==='miss'){ctx.fillStyle='#fff2a5';ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.fillText(event.shot==='saved'?'SAVED!':'JUST WIDE!',320,104)}
}
function updateLiveScore(){let goals=lastReport.events.filter(e=>e.type==='goal'&&e._shown);let h=0,a=0;goals.forEach(e=>{if(e.side==='home')h++;else a++});let el=$('liveScore');if(el)el.textContent=h+' - '+a}
function appendLiveLine(e){let box=$('liveCommentary');if(!box)return;let p=document.createElement('p');p.className=e.type==='goal'?'goal':e.type==='miss'?'miss':e.type==='whistle'?'whistle':'';p.innerHTML=`<b>${String(e.minute).padStart(2,'0')}'</b> ${esc(e.text)}`;box.appendChild(p);box.scrollTop=box.scrollHeight;let minute=$('liveMinute');if(minute)minute.textContent=String(e.minute).padStart(2,'0')+' MINUTES';}
function showHalfTimeCard(){
 const r=lastReport,m=r.mine,firstHalf=r.events.filter(e=>e.type==='goal'&&e.minute<=45);
 let homeGoals=firstHalf.filter(e=>e.side==='home').length,awayGoals=firstHalf.length-homeGoals;
 const scorerList=(side)=>{let list=firstHalf.filter(e=>e.side===side);return list.length?list.map(e=>`<p>${esc(e.scorer||'The striker')} <span class="muted">${e.minute}'</span></p>`).join(''):'<p class="muted">No goals</p>'};
 const overlay=document.createElement('div');overlay.className='halftime-overlay';overlay.innerHTML=`<section class="halftime-card"><h2>HALF TIME</h2><div class="halftime-sub">THE TEAMS HEAD FOR THE DRESSING ROOMS</div><div class="halftime-score"><span>${esc(m.home)}</span><strong>${homeGoals} – ${awayGoals}</strong><span>${esc(m.away)}</span></div><div class="halftime-scorers"><div><h3>${esc(m.home).toUpperCase()} · SCORERS</h3>${scorerList('home')}</div><div><h3>${esc(m.away).toUpperCase()} · SCORERS</h3>${scorerList('away')}</div></div><div class="halftime-note">45 MINUTES PLAYED · SECOND HALF TO FOLLOW</div><button id="halfTimeContinue" class="primary" style="margin-top:16px;padding:13px 22px;font-weight:bold">START SECOND HALF</button></section>`;
 document.body.appendChild(overlay);
 return new Promise(resolve=>{let finished=false;const finish=()=>{if(finished)return;finished=true;overlay.remove();resolve()};overlay.querySelector('#halfTimeContinue').addEventListener('click',finish)});
}
async function runScene(event,token,index,total){
 const caption=$('matchCaption');
 if(event.type==='whistle'&&event.minute===45){
   if(caption)caption.textContent='HALF TIME — THE TEAMS CHANGE ENDS';
   appendLiveLine({minute:45,type:'whistle',text:'HALF TIME! The teams head for the dressing rooms.'});
   playOneSound('whistle');
   await showHalfTimeCard();
   if(token!==animationToken||screenMode!=='match')return;
   const secondHalfDirection=getAttackDirection('home',46);
   const secondHalfView={minute:46,side:'home',type:'play',_scene:{nodes:[],steps:[],total:1,attacksRight:secondHalfDirection.attacksRight,side:'home',secondHalf:true}};
   drawPitchFrame(0,secondHalfView,'idle');
   if(caption)caption.textContent='SECOND HALF — HOME AND AWAY HAVE SWAPPED ENDS';
   return;
 }
 if(caption)caption.textContent=event.type==='goal'?`${String(event.minute).padStart(2,'0')}' — ATTACK BUILDING`:event.type==='miss'?`${String(event.minute).padStart(2,'0')}' — CHANCE DEVELOPING`:`${String(event.minute).padStart(2,'0')}' — PLAY MOVES FORWARD`;
 if(!event._scene)makeBallPath(event);
 const duration=Math.max(3800,Math.min(5600,event._scene.total*520));
 scheduleSceneKicks(event._scene,token,duration);
 await new Promise(resolve=>{let began=performance.now();function frame(now){if(token!==animationToken){resolve();return}let p=Math.min(1,(now-began)/duration);drawPitchFrame(p,event,'attack');if(p<1)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});
 if(token!==animationToken)return;
 if(event.type==='goal'){event._shown=true;scatterNextFormation=true;updateLiveScore();drawPitchFrame(1,event,'attack');if(caption)caption.textContent=`GOAL! ${event.scorer||'THE SCORER'}`;playOneSound('goal')}
 else if(event.type==='miss'){if(event.shot==='saved')scatterNextFormation=true;if(caption)caption.textContent=event.shot==='saved'?'THE GOALKEEPER SAVES IT!':'SHOT JUST WIDE!';playOneSound('miss')}
 else if(caption)caption.textContent='PLAY CONTINUES';
 appendLiveLine(event);
 await new Promise(resolve=>{matchTimer=setTimeout(resolve,event.type==='goal'?1800:800)});
}
async function startLiveHighlights(){
 if(matchTimer)clearTimeout(matchTimer);let token=++animationToken;if(soundEnabled)startCrowd();
 const sequence=lastReport.events.filter(e=>['goal','miss','play','booking'].includes(e.type)||(e.type==='whistle'&&e.minute===45));
 if(!sequence.some(e=>e.type==='whistle'&&e.minute===45))sequence.push({minute:45,type:'whistle',text:'HALF TIME. The players head for the dressing rooms.'});
 sequence.sort((a,b)=>a.minute-b.minute || ((a.type==='goal'?0:a.type==='whistle'?1:0)-(b.type==='goal'?0:b.type==='whistle'?1:0)));
 playOneSound('whistle');
 for(let i=0;i<sequence.length;i++){
  if(token!==animationToken||screenMode!=='match')return;
  let event=sequence[i];let minute=$('liveMinute');if(minute)minute.textContent=String(event.minute).padStart(2,'0')+' MINUTES';
  if(event.type!=='whistle')drawPitchFrame(0,event,'idle');
  await runScene(event,token,i,sequence.length);
 }
 if(token!==animationToken||screenMode!=='match')return;
 let caption=$('matchCaption');if(caption)caption.textContent='FULL TIME';let minute=$('liveMinute');if(minute)minute.textContent='90 MINUTES · FULL TIME';
 appendLiveLine({minute:90,type:'whistle',text:`FULL TIME! ${lastReport.mine.home} ${lastReport.mine.gf}-${lastReport.mine.ga} ${lastReport.mine.away}.`});
 playOneSound('whistle');
 await new Promise(resolve=>{matchTimer=setTimeout(resolve,2400)});
 if(token!==animationToken||screenMode!=='match')return;
 clearSoundTimers();stopCrowd();screenMode='results';render();
}
function animateIncident(index){let incidents=lastReport?.events.filter(e=>e.type==='goal'||e.type==='miss')||[];let e=incidents[index];if(!e)return;let token=++animationToken;let start=performance.now();function frame(now){if(token!==animationToken)return;let p=Math.min(1,(now-start)/2600);drawPitchFrame(p,e);if(p<1)requestAnimationFrame(frame);else{let c=$('matchCaption');if(c)c.textContent=e.type==='goal'?`GOAL! ${e.scorer||'THE STRIKER'}`:e.shot==='saved'?'SAVED!':'JUST WIDE!'}}requestAnimationFrame(frame)}
function watchHighlights(){screenMode='match';render()}
function newSeason(){
 if(game.week<=game.schedule.length)return;
 if(!confirm('Finish the season and apply promotion/relegation? Your club, squad and finances carry forward.'))return;
 if(game.pyramid){
  // Keep the managed club's identity before promotion/relegation mutates the division arrays.
  const managedClubName=me().name;
  promotionRelegation();
  const destination=DIVISION_ORDER.find(d=>game.pyramid.divisions[d].some(t=>t.name===managedClubName));
  if(!destination)throw new Error('Managed club missing after promotion/relegation: '+managedClubName);
  game.division=destination;
  game.teams=game.pyramid.divisions[destination];
  game.clubIndex=game.teams.findIndex(t=>t.name===managedClubName);
  game.schedule=game.pyramid.schedules[destination];
  game.pyramid.week=1;
  game.pyramid.season=game.season+1;
 }else{
  game.teams.forEach(resetTeamRecord);
  game.schedule=makeSchedule();
 }
 game.season++;
 game.week=1;
 game.squad.forEach(p=>{p.fitness=100;p.injury=0;p.selected=false;p.age++;p.form=5});
 autoSelect();
 game.morale=60;
 game.history.push({week:0,text:`SEASON ${game.season} BEGINS · ${game.division||'LEAGUE'}`,score:'NEW CAMPAIGN'});
 game.last=null;
 save();
 render();
}
function exportSave(){let blob=new Blob([JSON.stringify(game,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='touchline-manager-career.json';a.click();URL.revokeObjectURL(url)}function importSave(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.teams||!x.squad)throw Error();game=x;save();render();alert('Career imported successfully.')}catch(e){alert('That file is not a valid Touchline Manager career.')}};r.readAsText(f)}
if(!load())game=null;render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
