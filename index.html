<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101b16"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Touchline"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>1984 Touchline Manager</title>
<style>
:root{--bg:#101b16;--panel:#182820;--line:#42604b;--green:#9bd66b;--cream:#e5e2c6;--muted:#a8b39e;--red:#e28b72;--gold:#e4ca72}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font-family:'Courier New',monospace;font-size:14px;line-height:1.45}.wrap{max-width:760px;margin:auto;padding:12px}.mast{border:2px solid var(--green);padding:13px;text-align:center;background:#0b130f}.mast h1{font-size:clamp(23px,6vw,36px);letter-spacing:2px;color:var(--green);margin:0}.mast small{color:var(--muted);letter-spacing:3px}.scorebar{display:flex;justify-content:space-between;gap:8px;margin:10px 0;padding:9px;border:1px solid var(--line);background:#142119;color:var(--green);font-weight:bold}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:10px 0}.tabs button,button{font: bold 13px 'Courier New';border:1px solid var(--green);background:#1c3024;color:var(--cream);padding:10px 5px;cursor:pointer}.tabs button.active,button.primary{background:var(--green);color:#102015}.panel{border:1px solid var(--line);background:var(--panel);padding:13px;margin:9px 0}.panel h2{font-size:17px;color:var(--green);margin:0 0 10px;border-bottom:1px dashed var(--line);padding-bottom:7px}.muted{color:var(--muted)}.big{font-size:22px;color:var(--gold);font-weight:bold}.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dotted #3a5141}.row:last-child{border:0}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btnrow button{flex:1;min-width:115px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}.table th:first-child,.table td:first-child{text-align:left}.table th{color:var(--green)}.table tr.you{color:var(--gold);font-weight:bold}.player{display:grid;grid-template-columns:1fr 42px 65px;gap:5px;padding:7px 0;border-bottom:1px dotted var(--line);align-items:center}.player button{padding:5px}.player small{color:var(--muted)}.notice{color:var(--gold);padding:8px;border:1px dashed var(--gold);margin-top:8px}.good{color:var(--green)}.bad{color:var(--red)}.hidden{display:none}.footer{text-align:center;color:#728477;font-size:11px;padding:15px}.clubgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.club{padding:12px;text-align:left}.club strong{display:block;color:var(--green)}.club span{font-size:11px;color:var(--muted)}
</style></head><body><div class="wrap">
<header class="mast"><h1>TOUCHLINE MANAGER</h1><small>THE 1984 FOOTBALL CHALLENGE</small></header>
<div id="app"></div><div class="footer">AN ORIGINAL RETRO FOOTBALL MANAGEMENT GAME · OFFLINE EDITION</div>
</div>
<script>
const clubs=[['AFC Albion',68,22000],['Bristol Rovers',65,18000],['Cwm Valley',61,14000],['Dunford Town',60,13000],['Eastborough',58,12000],['Fleet Athletic',57,11000],['Glenchester',55,10000],['Haversham',53,9000]];
const names=['Mason','Price','Davies','Hughes','Morgan','Reed','Bennett','Clarke','Evans','Foster','Parker','Collins','Ward','Powell','Brooks','Turner','James','Ellis','Campbell','Morris','Bailey'];
const positions=['GK','DF','DF','DF','DF','MF','MF','MF','MF','FW','FW','GK','DF','DF','MF','MF','FW','FW','DF','MF','FW'];
let state=null,tab='home';
function fresh(clubIndex){let teams=clubs.map((c,i)=>({name:c[0],strength:c[1],cash:c[2],pts:0,w:0,d:0,l:0,gf:0,ga:0}));let my=teams[clubIndex];let squad=names.map((n,i)=>({name:n,position:positions[i],skill:50+Math.floor(Math.random()*35),fitness:85+Math.floor(Math.random()*16),selected:i<11}));return {clubIndex,teams,squad,week:1,cash:my.cash,morale:65,history:[],last:null,started:true}};
function save(){try{localStorage.setItem('tm84save',JSON.stringify(state))}catch(e){}}
function load(){try{let s=localStorage.getItem('tm84save');if(s){state=JSON.parse(s);return true}}catch(e){}return false}
function myClub(){return state.teams[state.clubIndex]}
function opponent(){let opp=(state.week*3+state.clubIndex+2)%8;if(opp===state.clubIndex)opp=(opp+1)%8;return opp}
function render(){const app=document.getElementById('app');if(!state){app.innerHTML=`<section class="panel"><h2>WELCOME, MANAGER</h2><p>Choose your club. Your task is simple: build a winning side, keep the books balanced and take your team to the top.</p><p class="muted">Eight clubs · 14 league fixtures · squad selection · finances · match reports.</p><h2>SELECT YOUR CLUB</h2><div class="clubgrid">${clubs.map((c,i)=>`<button class="club" onclick="start(${i})"><strong>${c[0]}</strong><span>Squad rating ${c[1]} · Funds £${c[2].toLocaleString('en-GB')}</span></button>`).join('')}</div><div class="notice">Tip: A stronger club is easier to manage, but the challenge is greater.</div></section>`;return}
let c=myClub();app.innerHTML=`<div class="scorebar"><span>${c.name.toUpperCase()}</span><span>WEEK ${state.week}/14</span><span>£${state.cash.toLocaleString('en-GB')}</span></div><nav class="tabs">${[['home','CLUB'],['team','TEAM'],['table','TABLE'],['records','NEWS']].map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';render()">${label}</button>`).join('')}</nav><main>${tab==='home'?home():tab==='team'?team():tab==='table'?table():records()}</main>`}
function home(){let opp=state.teams[opponent()];return `<section class="panel"><h2>CLUB REPORT</h2><div class="big">${myClub().name}</div><div class="row"><span>League position</span><b>${rank()+1} of 8</b></div><div class="row"><span>Team morale</span><b>${state.morale}%</b></div><div class="row"><span>Transfer funds</span><b>£${state.cash.toLocaleString('en-GB')}</b></div><div class="row"><span>Squad strength</span><b>${teamStrength()}</b></div></section><section class="panel"><h2>NEXT FIXTURE · WEEK ${state.week}</h2><div class="big" style="text-align:center">${myClub().name}<br><span class="muted">V</span><br>${opp.name}</div><p class="muted" style="text-align:center">League match · ${state.week%2?'Home':'Away'}</p><div class="btnrow"><button class="primary" onclick="playMatch()">PLAY MATCH</button><button onclick="tab='team';render()">SELECT TEAM</button></div>${state.last?`<div class="notice">LAST RESULT: ${state.last}</div>`:''}</section><section class="panel"><h2>MANAGER'S NOTEBOOK</h2><p>Keep your best players fit. A balanced side gives you the best chance of success.</p></section>`}
function team(){return `<section class="panel"><h2>FIRST TEAM SQUAD</h2><p class="muted">Select 11 players for match day. Tap SELECT / DROP to change your line-up.</p>${state.squad.map((p,i)=>`<div class="player"><div><b>${p.name}</b> <small>${p.position} · Skill ${p.skill} · Fit ${p.fitness}%</small></div><span>${p.selected?'IN':'—'}</span><button onclick="togglePlayer(${i})">${p.selected?'DROP':'SELECT'}</button></div>`).join('')}<div class="row"><span>Selected players</span><b>${state.squad.filter(p=>p.selected).length}/11</b></div><div class="btnrow"><button onclick="restTeam()">REST SQUAD</button><button onclick="tab='home';render()">BACK</button></div></section>`}
function table(){let sorted=[...state.teams].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);return `<section class="panel"><h2>LEAGUE TABLE</h2><table class="table"><thead><tr><th>CLUB</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>PTS</th></tr></thead><tbody>${sorted.map((t,i)=>`<tr class="${t===myClub()?'you':''}"><td>${i+1}. ${t.name}</td><td>${t.w+t.d+t.l}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.pts}</td></tr>`).join('')}</tbody></table><p class="muted">Two points for a win · One for a draw.</p></section>`}
function records(){return `<section class="panel"><h2>CLUB NEWS & RESULTS</h2>${state.history.length?state.history.slice().reverse().map(x=>`<div class="row"><span>WEEK ${x.week}: ${x.text}</span><b>${x.score}</b></div>`).join(''):'<p class="muted">No matches played yet. Your first fixture awaits.</p>'}<div class="btnrow"><button onclick="if(confirm('Start a new career? Your current season will be lost.')){state=null;localStorage.removeItem('tm84save');render()}">NEW CAREER</button></div></section>`}
function rank(){return [...state.teams].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)).indexOf(myClub())}
function teamStrength(){let s=state.squad.filter(p=>p.selected);return s.length?Math.round(s.reduce((a,p)=>a+p.skill*p.fitness/100,0)/s.length):0}
function start(i){state=fresh(i);tab='home';save();render()}
function togglePlayer(i){let p=state.squad[i];if(!p.selected&&state.squad.filter(x=>x.selected).length>=11){alert('You already have 11 players selected. Drop someone first.');return}p.selected=!p.selected;save();render()}
function restTeam(){state.squad.forEach(p=>p.fitness=Math.min(100,p.fitness+12));state.morale=Math.min(100,state.morale+2);save();render()}
function playMatch(){let selected=state.squad.filter(p=>p.selected);if(selected.length!==11){alert('Select exactly 11 players before kick-off.');tab='team';render();return}let oi=opponent(),opp=state.teams[oi],home=state.week%2===1;let power=teamStrength()+(home?5:0)+(state.morale-60)*.12;let diff=power-opp.strength;let gf=Math.max(0,Math.floor(Math.random()*3)+Math.floor(Math.random()*2)+(diff>12?1:0));let ga=Math.max(0,Math.floor(Math.random()*3)+Math.floor(Math.random()*2)+(diff< -12?1:0));if(Math.random()<.14)gf++;if(Math.random()<.14)ga++;let my=myClub();my.gf+=gf;my.ga+=ga;opp.gf+=ga;opp.ga+=gf;let result=gf>ga?'W':gf===ga?'D':'L';if(result==='W'){my.w++;my.pts+=2;state.morale=Math.min(100,state.morale+7);state.cash+=3500}else if(result==='D'){my.d++;my.pts++;state.morale=Math.min(100,state.morale+1);state.cash+=1800}else{my.l++;state.morale=Math.max(20,state.morale-7);state.cash=Math.max(0,state.cash+500)}if(gf>ga){opp.l++}else if(gf===ga){opp.d++;opp.pts++}else{opp.w++;opp.pts+=2}state.squad.forEach(p=>p.fitness=Math.max(45,p.fitness-(p.selected?12:4)));let text=`${my.name} v ${opp.name}`;let score=`${gf} - ${ga}`;state.last=`${text} ${score} (${result==='W'?'VICTORY':result==='D'?'DRAW':'DEFEAT'})`;state.history.push({week:state.week,text,score:state.last});state.week++;if(state.week>14){state.week=14;state.last+=' · SEASON COMPLETE'}save();render();}
if(!load())state=null;render();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }
</script></body></html>
